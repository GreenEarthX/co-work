[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# NO USABLE FALLBACK — DELIBERATE.
#
# alembic/env.py prefers ALEMBIC_DATABASE_URL, then DATABASE_URL, and only
# falls through to this line when NEITHER is exported. pydantic's `env_file`
# populates `settings`, NOT os.environ, so having them in backend/.env is not
# enough — they must be EXPORTED into the process environment.
#
# This line used to read:
#     postgresql://gex_user:<pw>@localhost:5432/gex_platform
# Port 5432 is a DIFFERENT, non-GEX PostgreSQL on this machine (GEX listens on
# 55432 via the gex-pg-forward container) and it is usually up — so an
# unexported migration run did not fail. It silently migrated the wrong
# database. The sentinel below aborts instead, naming the fix in the error.
#
#   export ALEMBIC_DATABASE_URL="$(grep -E '^ALEMBIC_DATABASE_URL=' .env | cut -d= -f2-)"
#   alembic upgrade auth_slice@head      # never bare `head` — see migration 030
sqlalchemy.url = EXPORT_ALEMBIC_DATABASE_URL_FIRST://no-fallback-see-comment-above

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
