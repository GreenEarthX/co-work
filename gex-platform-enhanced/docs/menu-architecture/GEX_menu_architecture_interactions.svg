<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img">
<title>GEX menu architecture - interaction and gate model</title>
<desc>How TopBar, TopBarDropdown, role filtering, gate locks, routing and CISO password gate interact in the local app.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0f172a}.muted{fill:#64748b}.tiny{font-size:10px}.small{font-size:11px}.body{font-size:12px}.head{font-size:14px;font-weight:700}.box{fill:#fff;stroke:#cbd5e1}.soft{fill:#f8fafc;stroke:#cbd5e1}.brand{fill:#ccfbf1;stroke:#0f766e}.warn{fill:#fef3c7;stroke:#b45309}.line{stroke:#94a3b8;stroke-width:1}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1180" height="720" fill="#f8fafc"/><text class="head" x="32" y="36">Menu interaction model - local implementation</text><rect class="box" x="32" y="72" width="210" height="78" rx="8"/><text class="head" x="46" y="98">UserRoleContext</text><text class="small muted" x="46" y="120">company_type, service_type,</text><text class="small muted" x="46" y="134">business_function, capabilities</text><rect class="box" x="292" y="72" width="210" height="78" rx="8"/><text class="head" x="306" y="98">MENU_TABS</text><text class="small muted" x="306" y="120">5 top-bar tabs, item sections,</text><text class="small muted" x="306" y="134">paths, visibility,</text><text class="small muted" x="306" y="148">gate_prerequisite</text><rect class="box" x="552" y="72" width="210" height="78" rx="8"/><text class="head" x="566" y="98">TopBar</text><text class="small muted" x="566" y="120">renders universal tabs,</text><text class="small muted" x="566" y="134">hover/click opens dropdown</text><rect class="box" x="812" y="72" width="300" height="78" rx="8"/><text class="head" x="826" y="98">TopBarDropdown</text><text class="small muted" x="826" y="120">groups by section, checks locks,</text><text class="small muted" x="826" y="134">navigates selected path</text><rect class="box" x="32" y="230" width="210" height="78" rx="8"/><text class="head" x="46" y="256">isVisible(item, role)</text><text class="small muted" x="46" y="278">filters by effective company types</text><text class="small muted" x="46" y="292">+ function + service type</text><rect class="box" x="292" y="230" width="210" height="78" rx="8"/><text class="head" x="306" y="256">useGateAccess</text><text class="small muted" x="306" y="278">backend screen-gates, fallback</text><text class="small muted" x="306" y="292">path -&gt; gate map, threshold 60%</text><rect class="box" x="552" y="230" width="210" height="78" rx="8"/><text class="head" x="566" y="256">React Router</text><text class="small muted" x="566" y="278">App.tsx protected routes under</text><text class="small muted" x="566" y="292">Layout</text><rect class="box" x="812" y="230" width="300" height="78" rx="8"/><text class="head" x="826" y="256">GatedRoute</text><text class="small muted" x="826" y="278">hard screen wrapper for selected</text><text class="small muted" x="826" y="292">protected views</text><rect class="box" x="32" y="388" width="210" height="78" rx="8"/><text class="head" x="46" y="414">CISO button</text><text class="small muted" x="46" y="436">always visible in TopBar</text><rect class="box" x="292" y="388" width="210" height="78" rx="8"/><text class="head" x="306" y="414">CISOGate</text><text class="small muted" x="306" y="436">password unlocks sessionStorage</text><text class="small muted" x="306" y="450">flag</text><rect class="box" x="552" y="388" width="210" height="78" rx="8"/><text class="head" x="566" y="414">CISO_ITEMS</text><text class="small muted" x="566" y="436">separate password-gated dropdown</text><rect class="box" x="812" y="388" width="300" height="78" rx="8"/><text class="head" x="826" y="414">CISO routes</text><text class="small muted" x="826" y="436">security, ABAC, barriers,</text><text class="small muted" x="826" y="450">residency, gateways, pricing admin</text><line class="line" x1="242" y1="111" x2="292" y2="111" marker-end="url(#arrow)"/><line class="line" x1="502" y1="111" x2="552" y2="111" marker-end="url(#arrow)"/><line class="line" x1="762" y1="111" x2="812" y2="111" marker-end="url(#arrow)"/><line class="line" x1="137" y1="150" x2="137" y2="230" marker-end="url(#arrow)"/><line class="line" x1="397" y1="150" x2="137" y2="230" marker-end="url(#arrow)"/><line class="line" x1="917" y1="150" x2="397" y2="230" marker-end="url(#arrow)"/><line class="line" x1="917" y1="150" x2="657" y2="230" marker-end="url(#arrow)"/><line class="line" x1="917" y1="308" x2="962" y2="308" marker-end="url(#arrow)"/><line class="line" x1="137" y1="466" x2="292" y2="427" marker-end="url(#arrow)"/><line class="line" x1="502" y1="427" x2="552" y2="427" marker-end="url(#arrow)"/><line class="line" x1="762" y1="427" x2="812" y2="427" marker-end="url(#arrow)"/><rect class="warn" x="32" y="550" width="1080" height="96" rx="8"/><text class="head" x="52" y="580">Known documentation risk surfaced by this view</text><text class="body" x="52" y="606">Some menu paths are reused by multiple labels, and route registration contains both direct paths and /finance/* aliases. The markdown inventory lists these aliases explicitly.</text><text class="body" x="52" y="628">This is why a persona-only SVG misses the real product behavior: visibility, locks and aliases are data-driven at runtime.</text></svg>
