# ── GEX Platform — run the full stack from Docker Hub ───────────────────
# No source code needed. Requires only Docker Desktop.
#
#   docker compose -f gex-demo-compose.yml up -d
#   → open http://localhost:8080
#
#   docker compose -f gex-demo-compose.yml down        (stop)
#   docker compose -f gex-demo-compose.yml pull        (get latest)
#
# ── NEVER RUN `down -v` AGAINST THIS FILE ───────────────────────────────
# `postgres_data` below is not disposable test state. It is the one real
# GEX database — backed up daily by backup_postgres.sh into db_backups/,
# but `down -v` deletes the volume immediately, with no prompt. This has
# already caused real data loss (2026-10-20, and plausibly earlier
# incidents too). If you need a clean pull of updated images, stop, rm and
# re-pull only backend/frontend/pf_engine — never add -v to a `down` run
# against this file. See PUBLISH_PROMPT.md section 6 for the safe sequence.
# ────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: gex_user
      POSTGRES_PASSWORD: gex_password_dev
      POSTGRES_DB: gex_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [gex_net]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [gex_net]

  # NOTE: service MUST be named "backend" — the frontend's nginx
  # proxies /api/ to http://backend:8000
  backend:
    image: jmlamay/gex-backend:v1.9.0
    environment:
      # The runtime role gex_app: no superuser, no BYPASSRLS, so row-level security applies
      # (migration 045). Until 2026-11-04 this was gex_user, the superuser that owns the
      # schema, which made every tenant policy decorative. gex_user is for migrations only.
      # The password comes from GEX_APP_DB_PASSWORD in files/.env (git-ignored).
      DATABASE_URL: postgresql://gex_app:${GEX_APP_DB_PASSWORD:-}@postgres:5432/gex_platform
      CANONICAL_DATABASE_URL: postgresql://gex_app:${GEX_APP_DB_PASSWORD:-}@postgres:5432/gex_platform
      # Every data slice on PostgreSQL, as on the development backend. Each defaults to
      # "sqlite" in config.py, so without these the container kept its data in a SQLite
      # file inside itself — outside the database, its backups and its row-level security.
      AUTH_DB_BACKEND: postgres
      EVIDENCE_DB_BACKEND: postgres
      CAPITAL_DB_BACKEND: postgres
      MARKET_DB_BACKEND: postgres
      ENTITLEMENT_DB_BACKEND: postgres
      EVENTSTORE_DB_BACKEND: postgres
      FUELREF_DB_BACKEND: postgres
      GOVERNANCE_DB_BACKEND: postgres
      DOMAIN_DB_BACKEND: postgres
      WORKSPACE_DB_BACKEND: postgres
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: demo_secret_not_for_production
      ENVIRONMENT: development
      PF_ENGINE_URL: http://pf_engine:8001
      TEA_ENGINE_URL: http://tea_engine:8002
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    networks: [gex_net]

  pf_engine:
    image: jmlamay/gex-pf-engine:v1.9.0
    environment:
      ENVIRONMENT: development
      # Since 2026-11-04 the engine keeps nothing in SQLite (needs an image built after that):
      # - its run log is in PostgreSQL (migration 082), written as its own role gex_engine
      #   (SELECT + INSERT on two tables, nothing else). The password comes from
      #   GEX_ENGINE_DB_PASSWORD in files/.env (git-ignored; the same value as the engine's
      #   gex_pf_engine/backend/.env). Unset, the engine still prices and stamps every run
      #   run_logged: false. A brand-new database needs the role first:
      #   backend/scripts/setup_postgres_rls.sql, then ALTER ROLE gex_engine PASSWORD.
      # - its offered fuels come from the platform API, the "backend" service below.
      GEX_ENGINE_DATABASE_URL: postgresql://gex_engine:${GEX_ENGINE_DB_PASSWORD:-}@postgres:5432/gex_platform
      GEX_PLATFORM_API_URL: http://backend:8000
    depends_on:
      postgres: {condition: service_healthy}
    networks: [gex_net]

  tea_engine:
    image: jmlamay/gex-tea-engine:v1.9.0
    environment:
      ENVIRONMENT: development
    networks: [gex_net]

  frontend:
    image: jmlamay/gex-frontend:v1.9.0
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks: [gex_net]

networks:
  gex_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
